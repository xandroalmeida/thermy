name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag vN precisa bater com "version" do metadata.json.
      - name: Verificar versão
        run: |
          VERSION="$(jq -r .version metadata.json)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} não corresponde a version=${VERSION} em metadata.json"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "UUID=$(jq -r .uuid metadata.json)" >> "$GITHUB_ENV"

      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Gerar .deb
        run: ./build-deb.sh

      # Mesmo formato de "gnome-extensions pack"; instalável com
      # gnome-extensions install <arquivo>.zip
      - name: Gerar .zip
        run: zip -r "dist/${UUID}.v${VERSION}.shell-extension.zip" metadata.json extension.js stylesheet.css icons

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.zip --title "Thermy $GITHUB_REF_NAME" --generate-notes
